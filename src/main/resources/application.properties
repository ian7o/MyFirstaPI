spring.application.name = rentsandclients
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/rentsAndClients?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=dsds

# Configurações do Hibernate (JPA)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Opcional: Configurações adicionais
spring.jpa.properties.hibernate.format_sql=true


logging.file.name = error.log
spring.output.ansi.enabled=always
logging.level.com.logging = TRACE
logging.pattern.file= %clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){green} [%level] %c{1.} [%t] %m%n
logging.level.root=INFO